<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>차량 사용일지</title>
    <link rel="icon" href="data:,">
    <!-- Pretendard, from its actual distribution. The previous build requested it
         from Google Fonts, where it does not exist, so the app silently rendered
         in the system fallback. Dynamic subset keeps the Korean payload small. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="topbar">
            <h1 class="mark">
                차량 사용일지<span class="mark-sub">운행 기록 관리</span>
            </h1>
        </header>

        <main class="sheet">
            <!-- The slip: a bounded object you fill in. -->
            <section class="slip" aria-labelledby="slipTitle">
                <div class="panel-head">
                    <h2 class="panel-title" id="slipTitle">운행일지 등록</h2>
                </div>

                <form id="vehicleLogForm" class="log-form" novalidate>
                    <div class="form-row">
                        <div class="field">
                            <label for="vehicleNo">차량</label>
                            <select id="vehicleNo" required>
                                <option value="">선택</option>
                                <option value="0704">0704</option>
                                <option value="8318">8318</option>
                                <option value="1213">1213</option>
                                <option value="5486">5486</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="driveDate">운행일</label>
                            <input type="text" id="driveDate" class="num" inputmode="numeric"
                                   placeholder="2026-08-07" maxlength="10"
                                   pattern="\d{4}-\d{2}-\d{2}" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="field">
                            <label for="departTime">출발</label>
                            <input type="text" id="departTime" class="num" inputmode="numeric"
                                   placeholder="09:00" maxlength="5" pattern="\d{2}:\d{2}" required>
                        </div>
                        <div class="field">
                            <label for="arriveTime">도착</label>
                            <input type="text" id="arriveTime" class="num" inputmode="numeric"
                                   placeholder="18:00" maxlength="5" pattern="\d{2}:\d{2}" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="field">
                            <label for="driverName">운전자</label>
                            <input type="text" id="driverName" required maxlength="20">
                        </div>
                        <div class="field">
                            <label for="passengerCount">인원</label>
                            <div class="field-unit">
                                <input type="number" id="passengerCount" class="num" min="1" required>
                                <span class="unit">명</span>
                            </div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="field">
                            <label for="odometer">계기판</label>
                            <div class="field-unit">
                                <input type="number" id="odometer" class="num" placeholder="10500" min="0" required>
                                <span class="unit">km</span>
                            </div>
                        </div>
                        <div class="field">
                            <label for="distance">운행거리</label>
                            <div class="field-unit">
                                <input type="number" id="distance" class="num" placeholder="45" min="0" step="any" required>
                                <span class="unit">km</span>
                            </div>
                        </div>
                    </div>

                    <div class="field">
                        <label for="destination">목적지</label>
                        <input type="text" id="destination" placeholder="광양시청" required maxlength="50">
                    </div>

                    <div class="field">
                        <label for="purpose">운행사유</label>
                        <input type="text" id="purpose" placeholder="본청 회의 참석" required maxlength="100">
                    </div>

                    <!-- The one optional field. Marking it is quieter than putting an
                         asterisk on the ten that are required. -->
                    <div class="field">
                        <label for="fuelCost">주유금액 <span class="opt">선택</span></label>
                        <div class="field-unit">
                            <input type="number" id="fuelCost" class="num" placeholder="50000" min="0">
                            <span class="unit">원</span>
                        </div>
                        <p class="hint">비워두고 저장할 수 있습니다.</p>
                    </div>

                    <div id="formAlert" class="alert-box hidden" role="status" aria-live="polite"></div>

                    <button type="submit" class="btn-primary">운행일지 저장</button>
                </form>
            </section>

            <!-- The ledger: unbounded, rules only, no card. -->
            <section class="ledger" aria-labelledby="ledgerTitle">
                <div class="panel-head">
                    <h2 class="panel-title" id="ledgerTitle">운행 기록</h2>
                    <span id="lastUpdated" class="last-updated"></span>
                </div>

                <div class="table-wrapper">
                    <table class="log-table">
                        <thead>
                            <tr>
                                <th scope="col">차량</th>
                                <th scope="col">운행일</th>
                                <th scope="col">시간</th>
                                <th scope="col">운전자</th>
                                <th scope="col">계기판</th>
                                <th scope="col">운행거리</th>
                                <th scope="col">목적지</th>
                                <th scope="col">운행사유</th>
                                <th scope="col">인원</th>
                                <th scope="col">주유금액</th>
                                <th scope="col"><span class="sr-only">관리</span></th>
                            </tr>
                        </thead>
                        <tbody id="logTableBody"></tbody>
                    </table>
                    <div id="emptyState" class="empty-state">
                        <p>등록된 운행일지가 없습니다.<br>양식을 작성하여 새로 추가해 보세요.</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
